name: Node.js Package
on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: "production"
      url: "https://www.npmjs.com/package/github-pewpew"
    steps:
      - uses: actions/checkout@v7
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Run tests
      - run: npm test
      # Release tags must match the package version exactly.
      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      # Confirm the configured npm credential can publish this package.
      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Manual runs validate the complete package without publishing it.
      - name: Validate package publication
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --dry-run
      # Publish to npm
      - name: Publish package
        if: github.event_name == 'release'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
